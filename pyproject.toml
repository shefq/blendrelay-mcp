[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "blendrelay-mcp"
dynamic = ["version"]
description = "General-purpose MCP server and AI workflow extension for Blender"
requires-python = ">=3.11"
readme = "README.md"
license = {text = "MIT AND GPL-3.0-or-later"}
dependencies = []

[project.scripts]
blendrelay-mcp = "blendrelay_mcp.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = {attr = "blendrelay_blender.version.__version__"}

[tool.setuptools.package-data]
blendrelay_blender = ["*.py", "blender_manifest.toml", "COPYING.txt"]
