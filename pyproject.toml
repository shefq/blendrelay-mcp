[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "archforge-mcp"
dynamic = ["version"]
description = "General-purpose local MCP tools and an AI workflow extension for Blender"
requires-python = ">=3.11"
readme = "README.md"
license = {text = "MIT AND GPL-3.0-or-later"}
dependencies = []

[project.scripts]
archforge-mcp = "archforge_mcp.cli:main"
archforge-runtime = "archforge_runtime.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = {attr = "archforge_blender.version.__version__"}

[tool.setuptools.package-data]
archforge_blender = ["*.py", "blender_manifest.toml", "COPYING.txt"]
