[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "blendrelay-mcp"
dynamic = ["version"]
description = "Blender AI add-on and MCP server for prompt-based 3D creation and editing"
requires-python = ">=3.11"
readme = "README.md"
license = "MIT AND GPL-3.0-or-later"
license-files = ["LICENSE", "src/blendrelay_blender/COPYING.txt"]
dependencies = []
keywords = [
    "blender",
    "blender-addon",
    "blender-mcp",
    "mcp-server",
    "model-context-protocol",
    "ai-3d",
    "3d-modeling",
    "generative-ai",
    "text-to-blender",
    "codex",
    "claude",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Plugins",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Graphics :: 3D Modeling",
]

[project.urls]
Homepage = "https://shefq.github.io/blendrelay-mcp/"
Documentation = "https://shefq.github.io/blendrelay-mcp/docs/"
Source = "https://github.com/shefq/blendrelay-mcp"
Issues = "https://github.com/shefq/blendrelay-mcp/issues"
Changelog = "https://github.com/shefq/blendrelay-mcp/releases"

[project.scripts]
blendrelay-mcp = "blendrelay_mcp.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = {attr = "blendrelay_blender.version.__version__"}

[tool.setuptools.package-data]
blendrelay_blender = ["*.py", "blender_manifest.toml", "COPYING.txt"]
