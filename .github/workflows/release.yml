name: Publish BlendRelay MCP

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    name: Build and validate distributions
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build tools
        run: python -m pip install --upgrade build twine

      - name: Verify tag matches package version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import os
          import pathlib
          import tomllib

          with pathlib.Path("src/blendrelay_blender/blender_manifest.toml").open("rb") as stream:
              expected = f"v{tomllib.load(stream)['version']}"
          actual = os.environ["RELEASE_TAG"]
          if actual != expected:
              raise SystemExit(f"Tag {actual!r} does not match package version {expected!r}")
          print(f"Publishing {actual}")
          PY

      - name: Build wheel and source distribution
        run: python -m build

      - name: Build Blender extension ZIP
        run: python tools/build_extension.py

      - name: Validate distribution metadata
        run: python -m twine check dist/*.whl dist/*.tar.gz

      - name: Smoke-test wheel installation
        run: |
          python -m venv release-venv
          release-venv/bin/python -m pip install --no-deps dist/*.whl
          release-venv/bin/blendrelay-mcp --help

      - name: Store Python distributions
        uses: actions/upload-artifact@v4
        with:
          name: python-package-distributions
          path: |
            dist/*.whl
            dist/*.tar.gz
          if-no-files-found: error

      - name: Store Blender extension distribution
        uses: actions/upload-artifact@v4
        with:
          name: blender-extension-distribution
          path: dist/*.zip
          if-no-files-found: error

  publish-pypi:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/blendrelay-mcp/
    permissions:
      id-token: write

    steps:
      - name: Download Python distributions
        uses: actions/download-artifact@v4
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish through PyPI Trusted Publishing
        uses: pypa/gh-action-pypi-publish@release/v1

  publish-github-release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download Python distributions
        uses: actions/download-artifact@v4
        with:
          name: python-package-distributions
          path: dist/

      - name: Download Blender extension
        uses: actions/download-artifact@v4
        with:
          name: blender-extension-distribution
          path: dist/

      - name: Create GitHub Release with assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.zip
            dist/*.whl
            dist/*.tar.gz
          generate_release_notes: true
          append_body: true
          body: |
            ---
            ⭐ **If you find BlendRelay MCP helpful, please consider starring the repository on [GitHub](https://github.com/shefq/blendrelay-mcp)! It helps more creators discover the project.**

